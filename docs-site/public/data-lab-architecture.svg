<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title description">
  <title id="title">Azure Data Lab Toolkit architecture</title>
  <desc id="description">YAML, templates, flags, and a terminal interface flow through Core, Providers, and Engines to data targets, with plans, reports, tests, and cleanup evidence as outputs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#53c9da"/>
    </marker>
  </defs>
  <rect width="1120" height="620" rx="14" fill="#10191d"/>
  <text x="54" y="58" fill="#f4f8fb" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700">From intent to evidence</text>
  <text x="54" y="86" fill="#9fb0b9" font-family="Inter,Segoe UI,sans-serif" font-size="15">One normalized plan keeps decisions visible across targets and engines.</text>

  <text x="54" y="144" fill="#79d8e5" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">INPUT</text>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="16">
    <rect x="54" y="164" width="180" height="56" rx="6" fill="#18272e" stroke="#41545e"/>
    <text x="78" y="198" fill="#f4f8fb">Versioned YAML</text>
    <rect x="54" y="232" width="180" height="56" rx="6" fill="#18272e" stroke="#41545e"/>
    <text x="78" y="266" fill="#f4f8fb">Templates + TUI</text>
    <rect x="54" y="300" width="180" height="56" rx="6" fill="#18272e" stroke="#41545e"/>
    <text x="78" y="334" fill="#f4f8fb">Explicit flags</text>
  </g>

  <path d="M 244 260 H 302" stroke="#53c9da" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="316" y="144" fill="#79d8e5" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">TOOLKIT</text>
  <rect x="316" y="164" width="490" height="112" rx="8" fill="#15313a" stroke="#53c9da" stroke-width="2"/>
  <text x="344" y="199" fill="#f4f8fb" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">Core</text>
  <text x="344" y="230" fill="#b8c6cd" font-family="Inter,Segoe UI,sans-serif" font-size="15">Validate  ·  Assess  ·  Plan  ·  Catalog  ·  Cost</text>
  <text x="344" y="254" fill="#b8c6cd" font-family="Inter,Segoe UI,sans-serif" font-size="15">Run state  ·  Policy  ·  Report  ·  Lifecycle</text>

  <path d="M 561 277 V 315" stroke="#53c9da" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="316" y="330" width="490" height="112" rx="8" fill="#25261e" stroke="#e1b350" stroke-width="2"/>
  <text x="344" y="365" fill="#f4f8fb" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">Providers</text>
  <text x="344" y="396" fill="#c9c7b4" font-family="Inter,Segoe UI,sans-serif" font-size="15">SQL VM  ·  Azure SQL  ·  Fabric  ·  PostgreSQL</text>
  <text x="344" y="420" fill="#c9c7b4" font-family="Inter,Segoe UI,sans-serif" font-size="15">Storage  ·  Git  ·  Software  ·  Databricks</text>

  <path d="M 561 443 V 481" stroke="#53c9da" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="316" y="496" width="490" height="70" rx="8" fill="#1d2d25" stroke="#54b883" stroke-width="2"/>
  <text x="344" y="539" fill="#f4f8fb" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">Engines</text>
  <text x="468" y="539" fill="#bfd6c8" font-family="Inter,Segoe UI,sans-serif" font-size="15">PowerShell first  ·  Bicep later  ·  Terraform later</text>

  <path d="M 817 260 H 875" stroke="#53c9da" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="889" y="144" fill="#79d8e5" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">OUTPUT</text>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="16">
    <rect x="889" y="164" width="177" height="56" rx="6" fill="#18272e" stroke="#41545e"/>
    <text x="913" y="198" fill="#f4f8fb">Reviewed plan</text>
    <rect x="889" y="232" width="177" height="56" rx="6" fill="#18272e" stroke="#41545e"/>
    <text x="913" y="266" fill="#f4f8fb">Deployed lab</text>
    <rect x="889" y="300" width="177" height="56" rx="6" fill="#18272e" stroke="#41545e"/>
    <text x="913" y="334" fill="#f4f8fb">HTML evidence</text>
    <rect x="889" y="368" width="177" height="56" rx="6" fill="#18272e" stroke="#41545e"/>
    <text x="913" y="402" fill="#f4f8fb">Probe results</text>
    <rect x="889" y="436" width="177" height="56" rx="6" fill="#18272e" stroke="#41545e"/>
    <text x="913" y="470" fill="#f4f8fb">Cleanup proof</text>
  </g>

  <text x="54" y="584" fill="#ff8989" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">CURRENT STATUS</text>
  <text x="205" y="584" fill="#cbd6db" font-family="Inter,Segoe UI,sans-serif" font-size="14">Architecture scaffold · No deployable cmdlets yet · SQL Server on Azure VM is first</text>
</svg>
