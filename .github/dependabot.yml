# PowerShell dependencies are deliberately absent from this file.
#
# The Az modules, Pester, PSScriptAnalyzer and powershell-yaml are pinned by
# name, version, GUID and content digest in
# src/AzureDataLabToolkit/Support/runtime-dependencies.lock.json and
# build-tools.lock.json. Dependabot cannot read those locks, and a bump that
# did not also update the digests would fail closed at module import. Those
# dependencies are updated by hand, with the digests re-harvested.
version: 2
updates:
  # The workflows pin every third-party action to an immutable commit SHA, so
  # this is the mechanism that keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
      - documentation
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "@slidev/*"
          - "slidev"
