name: PowerShell module checks

on:
  # No path filter: "Module checks" is a required check, so this workflow must
  # report on every pull request. The changes job decides what has to run.
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
    # GitHub does not evaluate path filters for tag pushes, so every v* tag
    # runs the full release path.
    paths:
      - .github/workflows/*.yml
      - .github/workflows/*.yaml
      - .gitattributes
      - .editorconfig
      - PSScriptAnalyzerSettings.psd1
      - build.ps1
      - examples/**
      - src/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-checks-${{ github.ref }}
  # A tag run publishes a release, so a later run in this group must not
  # cancel it once it has started.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  changes:
    name: Detect module changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}

    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # On a pull request the pattern applies the push path filter above. The
      # three-dot diff starts at the merge base, as GitHub's own path filter
      # does, and --no-renames keeps a file moved out of src/ visible. -z
      # passes every path verbatim (git otherwise quotes unusual names) and
      # LC_ALL=C matches it byte for byte; %q logs each untrusted name as one
      # inert line. Every other event runs the checks.
      - name: Detect changes that need the module checks
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LC_ALL: C
        run: |
          set -euo pipefail
          relevant=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            pattern='^(\.github/workflows/[^/]+\.ya?ml|\.gitattributes|\.editorconfig|PSScriptAnalyzerSettings\.psd1|build\.ps1|(examples|src|tests)/.+)$'
            changed_files="$RUNNER_TEMP/changed-files"
            git diff --name-only --no-renames -z \
              "${BASE_SHA:?}...${HEAD_SHA:?}" > "$changed_files"
            relevant=false
            echo 'Files changed by this pull request:'
            while IFS= read -r -d '' path; do
              printf '  - %q\n' "$path"
              if [[ "$path" =~ $pattern ]]; then
                relevant=true
              fi
            done < "$changed_files"
          fi
          echo "relevant=$relevant" | tee -a "$GITHUB_OUTPUT"

  offline-contracts:
    name: PowerShell 7.6 / ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify PowerShell and stage pinned test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version] '7.6.0') {
            throw "PowerShell 7.6 or later is required; found $($PSVersionTable.PSVersion)."
          }

          $moduleRoot = Join-Path $env:RUNNER_TEMP 'adlt-modules'
          if (Test-Path -LiteralPath $moduleRoot) {
            Remove-Item -LiteralPath $moduleRoot -Recurse -Force
          }
          [void] (New-Item -ItemType Directory -Path $moduleRoot -Force)

          $pinned = @(
            @{ Name = 'Pester'; Version = '5.7.1' }
            @{ Name = 'PSScriptAnalyzer'; Version = '1.25.0' }
            @{ Name = 'powershell-yaml'; Version = '0.4.12' }
            @{ Name = 'Az.Accounts'; Version = '5.5.0' }
            @{ Name = 'Az.Resources'; Version = '10.0.0' }
            @{ Name = 'Az.Compute'; Version = '11.6.0' }
            @{ Name = 'Az.KeyVault'; Version = '6.5.0' }
            @{ Name = 'Az.Monitor'; Version = '8.0.0' }
          )
          foreach ($dependency in $pinned) {
            Save-PSResource `
              -Name $dependency.Name `
              -Version $dependency.Version `
              -Repository PSGallery `
              -TrustRepository `
              -Path $moduleRoot `
              -SkipDependencyCheck `
              -ErrorAction Stop
          }

          # Both the build-tool lock and the module's runtime dependency lock
          # require every locked dependency to resolve to exactly one manifest.
          # Runner images preinstall some of these, which makes resolution
          # ambiguous, so later steps narrow the search path to these staged
          # copies plus the PowerShell built-ins.
          #
          # PSModulePath is set inside each pwsh session rather than exported
          # through GITHUB_ENV: PowerShell re-adds the default user and shared
          # module directories to an inherited PSModulePath at startup, which
          # would reintroduce the duplicate.
          "ADLT_MODULE_ROOT=$moduleRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $env:PSModulePath = @(
            $moduleRoot
            (Join-Path $PSHOME 'Modules')
          ) -join [System.IO.Path]::PathSeparator

          foreach ($dependency in $pinned) {
            $found = @(Get-Module -ListAvailable -Name $dependency.Name)
            "{0,-18} {1}" -f $dependency.Name, $found.Count
            foreach ($candidate in $found) { "  $($candidate.Path)" }
            if ($found.Count -ne 1) {
              throw (
                "Dependency '$($dependency.Name)' must resolve to exactly " +
                "one manifest; found $($found.Count)."
              )
            }
          }

      # The Ubuntu runner image ships /opt/microsoft/powershell/7 as mode 0777.
      # The toolkit refuses to bootstrap from a world-writable PowerShell
      # installation, and it is right to: anything on the box could rewrite the
      # module used to fetch every other dependency. Harden the directory
      # rather than relaxing the check.
      - name: Harden the Linux PowerShell installation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod -R go-w /opt/microsoft/powershell/7
          stat -c '%a %n' /opt/microsoft/powershell/7

      - name: Analyze, test, build, and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PSModulePath = @(
            $env:ADLT_MODULE_ROOT
            (Join-Path $PSHOME 'Modules')
          ) -join [System.IO.Path]::PathSeparator
          ./build.ps1 -Task All

      - name: Stage tested release package
        if: >-
          github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-release-package
          path: out/packages/*.zip
          if-no-files-found: error
          # Kept long enough for a re-run of the failed release jobs alone.
          retention-days: 7
          compression-level: 0

  module-checks:
    name: Module checks
    # A skipped required check counts as passing, so this job must never be
    # skipped. always(), unlike !cancelled(), runs it even in a cancelled run,
    # and the step fails unless the upstream results are consistent.
    if: always()
    needs: [changes, offline-contracts]
    runs-on: ubuntu-latest

    steps:
      - name: Require passed or deliberately skipped module checks
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          CHECKS_RESULT: ${{ needs.offline-contracts.result }}
        run: |
          set -euo pipefail
          expected=''
          if [[ "$CHANGES_RESULT" == success && "$RELEVANT" == true ]]; then
            expected=success
          elif [[ "$CHANGES_RESULT" == success && "$RELEVANT" == false ]]; then
            expected=skipped
          fi
          if [[ -z "$expected" || "$CHECKS_RESULT" != "$expected" ]]; then
            echo "::error::Module checks failed: changes=$CHANGES_RESULT, relevant='$RELEVANT', checks=$CHECKS_RESULT."
            exit 1
          fi
          echo "Module checks passed: relevant=$RELEVANT, checks=$CHECKS_RESULT."

  release-provenance:
    name: Protected release provenance
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: offline-contracts
    runs-on: ubuntu-latest
    # This job runs repository code (it dot-sources build.ps1), so its token
    # can only read. Attesting and publishing happen in publish-release.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
      commit: ${{ steps.verify.outputs.commit }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download package that passed all platform checks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-release-package
          path: release-input

      - name: Verify protected release identity and generate evidence
        id: verify
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (
            $env:RELEASE_TAG -cnotmatch
              '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+)?$'
          ) {
            throw (
              "Release tag '$env:RELEASE_TAG' must have the form " +
              'v<major>.<minor>.<patch>[-<prerelease>].'
            )
          }

          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'The release tag is not reachable from main.'
          }
          $releaseCommit = @(
            git rev-parse --verify "$env:RELEASE_TAG^{commit}"
          )
          $headCommit = @(git rev-parse --verify 'HEAD^{commit}')
          if (
            $LASTEXITCODE -ne 0 -or
            $releaseCommit.Count -ne 1 -or
            $headCommit.Count -ne 1 -or
            [string] $releaseCommit[0] -cne [string] $headCommit[0]
          ) {
            throw 'The release tag does not identify the tested commit.'
          }

          $manifest = Import-PowerShellDataFile `
            -LiteralPath src/AzureDataLabToolkit/AzureDataLabToolkit.psd1
          $baseVersion = [string] $manifest.ModuleVersion
          $version = $baseVersion
          $prerelease = [string] $manifest.PrivateData.PSData.Prerelease
          if (-not [string]::IsNullOrWhiteSpace($prerelease)) {
            $version = "$version-$prerelease"
          }
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' must equal '$expectedTag'."
          }

          $releaseNotesPath = "release-notes/$version.md"
          $releaseNotesDirectory = Get-Item `
            -LiteralPath release-notes `
            -ErrorAction SilentlyContinue
          $releaseNotes = Get-Item `
            -LiteralPath $releaseNotesPath `
            -ErrorAction SilentlyContinue
          if (
            $null -eq $releaseNotesDirectory -or
            ($releaseNotesDirectory.Attributes -band
              [System.IO.FileAttributes]::ReparsePoint) -ne 0 -or
            $null -eq $releaseNotes -or
            $releaseNotes.PSIsContainer -or
            ($releaseNotes.Attributes -band
              [System.IO.FileAttributes]::ReparsePoint) -ne 0 -or
            [string]::IsNullOrWhiteSpace(
              [System.IO.File]::ReadAllText($releaseNotes.FullName)
            )
          ) {
            throw (
              "Release notes '$releaseNotesPath' must be a regular, " +
              'non-empty file.'
            )
          }

          $changelogHeading = "## [$version]"
          $changelogSections = @(
            [System.IO.File]::ReadAllLines(
              (Get-Item -LiteralPath CHANGELOG.md).FullName
            ) |
              Where-Object {
                $_ -ceq $changelogHeading -or
                $_.StartsWith(
                  "$changelogHeading - ",
                  [System.StringComparison]::Ordinal
                )
              }
          )
          if ($changelogSections.Count -ne 1) {
            throw (
              "CHANGELOG.md must contain exactly one '$changelogHeading' " +
              'section.'
            )
          }

          $packages = @(
            Get-ChildItem `
              -LiteralPath release-input `
              -Filter '*.zip' `
              -File `
              -Recurse
          )
          if ($packages.Count -ne 1) {
            throw 'Exactly one tested release package is required.'
          }
          $package = $packages[0]
          $expectedName = "AzureDataLabToolkit-$version.zip"
          if ($package.Name -cne $expectedName) {
            throw "Release package must be named '$expectedName'."
          }

          . ./build.ps1
          $extractionRoot = Join-Path $PWD 'release-package'
          Expand-Archive `
            -LiteralPath $package.FullName `
            -DestinationPath $extractionRoot
          $provenanceFiles = @(
            Get-ChildItem `
              -LiteralPath $extractionRoot `
              -Filter 'build-provenance.json' `
              -File `
              -Recurse
          )
          if ($provenanceFiles.Count -ne 1) {
            throw 'The release package must contain one provenance file.'
          }
          $packagedModuleRoot = $provenanceFiles[0].Directory.FullName
          $expectedModuleRoot = Join-Path `
            $extractionRoot `
            "AzureDataLabToolkit/$baseVersion"
          if (
            [System.IO.Path]::GetFullPath($packagedModuleRoot) -cne
              [System.IO.Path]::GetFullPath($expectedModuleRoot)
          ) {
            throw 'The release package module layout is invalid.'
          }
          [void] (Test-AdltBuildProvenance `
            -ModulePath $packagedModuleRoot `
            -ExpectedSourceRevision ([string] $headCommit[0]) `
            -ExpectedModuleVersion $version `
            -RequireGit)

          $evidenceRoot = Join-Path $PWD 'release-evidence'
          [void] (New-Item -ItemType Directory -Path $evidenceRoot)
          $packageHash = (
            Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $checksumPath = Join-Path `
            $evidenceRoot `
            "$($package.Name).sha256"
          [System.IO.File]::WriteAllText(
            $checksumPath,
            "$packageHash  $($package.Name)`n",
            [System.Text.UTF8Encoding]::new($false)
          )

          $lock = Get-Content `
            -LiteralPath `
              src/AzureDataLabToolkit/Support/runtime-dependencies.lock.json `
            -Raw |
              ConvertFrom-Json -AsHashtable -Depth 20 -NoEnumerate
          $buildToolLock = Get-Content `
            -LiteralPath `
              src/AzureDataLabToolkit/Support/build-tools.lock.json `
            -Raw |
              ConvertFrom-Json -AsHashtable -Depth 20 -NoEnumerate
          $packages = [System.Collections.Generic.List[object]]::new()
          $relationships = [System.Collections.Generic.List[object]]::new()
          $relationships.Add([ordered]@{
              spdxElementId = 'SPDXRef-DOCUMENT'
              relationshipType = 'DESCRIBES'
              relatedSpdxElement = 'SPDXRef-Package-AzureDataLabToolkit'
            })
          $packages.Add([ordered]@{
              name = 'AzureDataLabToolkit'
              SPDXID = 'SPDXRef-Package-AzureDataLabToolkit'
              versionInfo = $version
              downloadLocation = 'NOASSERTION'
              filesAnalyzed = $false
              checksums = @(
                [ordered]@{
                  algorithm = 'SHA256'
                  checksumValue = $packageHash
                }
              )
              licenseConcluded = 'NOASSERTION'
              licenseDeclared = 'NOASSERTION'
              copyrightText = 'NOASSERTION'
            })
          $index = 0
          foreach ($dependency in @($lock.dependencies)) {
            $index++
            $spdxId = "SPDXRef-Package-RuntimeDependency-$index"
            $dependencyHash = (
              [string] $dependency.packageDigest
            ).Substring('sha256:'.Length)
            $packages.Add([ordered]@{
                name = [string] $dependency.name
                SPDXID = $spdxId
                versionInfo = [string] $dependency.version
                downloadLocation = [string] $dependency.packageUri
                filesAnalyzed = $false
                checksums = @(
                  [ordered]@{
                    algorithm = 'SHA256'
                    checksumValue = $dependencyHash
                  }
                )
                sourceInfo = (
                  'The package-archive checksum is recorded from the ' +
                  'reviewed runtime dependency lock and is not re-verified ' +
                  'when this release is built or installed. Installed ' +
                  'content is verified against the locked ' +
                  'sha256-rfc8785-file-manifest-v1 content identity ' +
                  [string] $dependency.contentDigest + '.'
                )
                licenseConcluded = 'NOASSERTION'
                licenseDeclared = 'NOASSERTION'
                copyrightText = 'NOASSERTION'
                externalRefs = @(
                  [ordered]@{
                    referenceCategory = 'PACKAGE-MANAGER'
                    referenceType = 'purl'
                    referenceLocator = (
                      'pkg:nuget/{0}@{1}' -f
                        [uri]::EscapeDataString(
                          [string] $dependency.name
                        ),
                        [uri]::EscapeDataString(
                          [string] $dependency.version
                        )
                    )
                  }
                )
              })
            $relationships.Add([ordered]@{
                spdxElementId = 'SPDXRef-Package-AzureDataLabToolkit'
                relationshipType = 'DEPENDS_ON'
                relatedSpdxElement = $spdxId
              })
          }
          $index = 0
          foreach ($buildTool in @($buildToolLock.buildTools)) {
            $index++
            $spdxId = "SPDXRef-Package-BuildTool-$index"
            $packages.Add([ordered]@{
                name = [string] $buildTool.name
                SPDXID = $spdxId
                versionInfo = [string] $buildTool.version
                downloadLocation = [string] $buildTool.packageUri
                filesAnalyzed = $false
                sourceInfo = (
                  'Build-time dependency verified using the locked ' +
                  'sha256-rfc8785-file-manifest-v1 content identity ' +
                  [string] $buildTool.contentDigest +
                  '. This is not the package-archive checksum.'
                )
                licenseConcluded = 'NOASSERTION'
                licenseDeclared = 'NOASSERTION'
                copyrightText = 'NOASSERTION'
                externalRefs = @(
                  [ordered]@{
                    referenceCategory = 'PACKAGE-MANAGER'
                    referenceType = 'purl'
                    referenceLocator = (
                      'pkg:nuget/{0}@{1}' -f
                        [uri]::EscapeDataString(
                          [string] $buildTool.name
                        ),
                        [uri]::EscapeDataString(
                          [string] $buildTool.version
                        )
                    )
                  }
                )
              })
            $relationships.Add([ordered]@{
                spdxElementId = $spdxId
                relationshipType = 'BUILD_DEPENDENCY_OF'
                relatedSpdxElement = 'SPDXRef-Package-AzureDataLabToolkit'
              })
          }

          $documentNamespace = (
            'https://github.com/{0}/actions/runs/{1}/attempts/{2}/sbom' -f
              $env:REPOSITORY,
              $env:RUN_ID,
              $env:RUN_ATTEMPT
          )
          $sbom = [ordered]@{
            spdxVersion = 'SPDX-2.3'
            dataLicense = 'CC0-1.0'
            SPDXID = 'SPDXRef-DOCUMENT'
            name = "AzureDataLabToolkit-$version"
            documentNamespace = $documentNamespace
            creationInfo = [ordered]@{
              created = [datetime]::UtcNow.ToString(
                'yyyy-MM-ddTHH:mm:ssZ',
                [Globalization.CultureInfo]::InvariantCulture
              )
              creators = @(
                'Tool: AzureDataLabToolkit-release-workflow'
              )
            }
            packages = @($packages.ToArray())
            relationships = @($relationships.ToArray())
          }
          $sbomPath = Join-Path $evidenceRoot 'sbom.spdx.json'
          [System.IO.File]::WriteAllText(
            $sbomPath,
            ($sbom | ConvertTo-Json -Depth 20),
            [System.Text.UTF8Encoding]::new($false)
          )
          Copy-Item `
            -LiteralPath $package.FullName `
            -Destination (Join-Path $evidenceRoot $package.Name)
          Copy-Item `
            -LiteralPath $releaseNotes.FullName `
            -Destination (Join-Path $evidenceRoot 'release-notes.md')

          $isPrerelease = 'false'
          if (-not [string]::IsNullOrWhiteSpace($prerelease)) {
            $isPrerelease = 'true'
          }
          @(
            "version=$version"
            "prerelease=$isPrerelease"
            "commit=$($headCommit[0])"
          ) |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload release package, checksum, SBOM, and notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AzureDataLabToolkit-${{ github.ref_name }}
          path: release-evidence/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish-release:
    name: Publish release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: release-provenance
    runs-on: ubuntu-latest
    # The only job with write or OIDC permissions, so it never checks out or
    # runs repository code: it only attests and publishes verified evidence.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download verified release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: AzureDataLabToolkit-${{ github.ref_name }}
          path: release-evidence

      - name: Attest release build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-evidence/AzureDataLabToolkit-*.zip

      - name: Attest release SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-evidence/AzureDataLabToolkit-*.zip
          sbom-path: release-evidence/sbom.spdx.json

      # Checked immediately before publishing, which is the step that binds
      # the tag to the release; the attestations bind the package, not the tag.
      - name: Confirm the tag still identifies the verified commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERIFIED_COMMIT: ${{ needs.release-provenance.outputs.commit }}
        run: |
          set -euo pipefail
          tag_commit="$(
            gh api "repos/$REPOSITORY/commits/refs/tags/$TAG" --jq .sha
          )"
          if [[ -z "$VERIFIED_COMMIT" || "$tag_commit" != "$VERIFIED_COMMIT" ]]; then
            echo "::error::Tag $TAG identifies '$tag_commit', not the verified commit '$VERIFIED_COMMIT'."
            exit 1
          fi
          echo "Tag $TAG still identifies the verified commit $tag_commit."

      # Retries: a failed run leaves no partial public release, and an
      # existing release is never replaced.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.release-provenance.outputs.version }}
          PRERELEASE: ${{ needs.release-provenance.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The list, unlike the by-tag endpoint, includes drafts.
          existing="$(
            gh api --paginate "repos/$REPOSITORY/releases?per_page=100" |
              jq -s --arg tag "$TAG" \
                '[.[][] | select(.tag_name == $tag)] | length'
          )"
          if [[ "$existing" != 0 ]]; then
            echo "::error::$TAG already has a release (draft or published); refusing to replace it."
            exit 1
          fi

          options=(
            --repo "$REPOSITORY"
            --verify-tag
            --title "$TAG"
            --notes-file release-evidence/release-notes.md
          )
          case "$PRERELEASE" in
            true) options+=(--prerelease --latest=false) ;;
            false) ;;
            *)
              echo "::error::Unexpected prerelease value '$PRERELEASE'."
              exit 1
              ;;
          esac

          package="release-evidence/AzureDataLabToolkit-$VERSION.zip"
          assets=("$package" "$package.sha256" release-evidence/sbom.spdx.json)
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Release asset $asset is missing."
              exit 1
            fi
          done

          # Without --draft, gh creates the release as a draft, uploads every
          # asset, and only then publishes it, deleting the draft on failure.
          gh release create "$TAG" "${options[@]}" "${assets[@]}"
