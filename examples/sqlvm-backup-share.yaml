schemaVersion: "1.0"
kind: AzureDataLab
template: sqlvm-secure
metadata:
  name: sqlvm-backup-lab
  description: SQL Server VM plan with private Azure Files backup staging
target:
  type: sqlVm
azure:
  cloud: AzureCloud
  tenantId: 11111111-1111-4111-8111-111111111111
  subscriptionId: 22222222-2222-4222-8222-222222222222
  location: switzerlandnorth
  authentication:
    mode: interactive-user
    contextScope: process
  resourceGroup:
    mode: create
    name: rg-adlt-sqlvm-backup-lab
capabilities:
  backupShare:
    enabled: true
    driveLetter: S
    quotaGiB: 100
    authentication: managed-identity-smb-oauth
    networkAccess: private-endpoint
